<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h1>High Score: <span id="Highscore">0</span></h1>
                </div>
                <div class="info">
                    <h1>Score: <span id="score">0</span></h1>
                </div>
                <div class="info">
                    <h1>Time: <span id="time">00-00</span></h1>
                </div>
            </div>
            <div id="board" class="board"></div>
        </section>
        <div id="modal" class="modal">
            <div id="start-game" class="start-game">
                <h1>Wellcome to Snake Game</h1>
                <button id="startbtn" class="btn ">Start Game</button>
                <p>made by @Extroz.Studio</p>
            </div>
            <div id="game-over" class="game-over">
                <h1>Game Over</h1>
                <button id="restartbtn" class="btn ">Restart Game</button>
                <p>made by @Extroz.Studio</p>
            </div>
        </div>
    </main>



    <script src="script.js"></script>
</body>

</html>
